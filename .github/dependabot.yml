version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      react-packages:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      development-dependencies:
        dependency-type: development
        exclude-patterns:
          - "typescript"
    ignore:
      - dependency-name: "typescript"
        versions:
          - ">=7.0.0"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
