name: Approved fork preview

on:
  workflow_run:
    workflows: [Request approved fork preview]
    types: [completed]
  pull_request_target:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to preview
        required: true
        type: number

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  resolve-manual-pr:
    name: Validate manual preview request
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.actor == 'alexalmansa'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      pr_number: ${{ steps.pr.outputs.pr_number }}
      head_repo: ${{ steps.pr.outputs.head_repo }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
    steps:
      - name: Validate the current PR head
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          case "$PR_NUMBER" in
            ''|*[!0-9]*)
              echo "Enter a valid pull request number."
              exit 1
              ;;
          esac

          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          state="$(jq -r '.state' <<<"$pr_json")"
          head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
          head_repo="$(jq -r '.head.repo.full_name' <<<"$pr_json")"

          test "$state" = open
          test "$head_repo" != "$GITHUB_REPOSITORY"
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]

          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "head_repo=$head_repo" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

  build-manual-pr:
    name: Build fork PR without deployment credentials
    needs: resolve-manual-pr
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the exact fork commit
        uses: actions/checkout@v7
        with:
          repository: ${{ needs.resolve-manual-pr.outputs.head_repo }}
          ref: ${{ needs.resolve-manual-pr.outputs.head_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build static site
        run: |
          npm ci --prefix app
          npm run build --prefix app

      - name: Upload static build
        uses: actions/upload-artifact@v4
        with:
          name: fork-preview-${{ needs.resolve-manual-pr.outputs.pr_number }}
          path: app/dist
          if-no-files-found: error
          retention-days: 1

  deploy-manual-pr:
    name: Deploy fork PR to Cloudflare Pages
    needs: [resolve-manual-pr, build-manual-pr]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      deployments: write
      pull-requests: read
    steps:
      - name: Download static build
        uses: actions/download-artifact@v4
        with:
          name: fork-preview-${{ needs.resolve-manual-pr.outputs.pr_number }}
          path: app/dist

      - name: Confirm the PR head has not changed
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.resolve-manual-pr.outputs.pr_number }}
          EXPECTED_SHA: ${{ needs.resolve-manual-pr.outputs.head_sha }}
          EXPECTED_REPO: ${{ needs.resolve-manual-pr.outputs.head_repo }}
        run: |
          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          test "$(jq -r '.state' <<<"$pr_json")" = open
          test "$(jq -r '.head.sha' <<<"$pr_json")" = "$EXPECTED_SHA"
          test "$(jq -r '.head.repo.full_name' <<<"$pr_json")" = "$EXPECTED_REPO"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install pinned Wrangler
        run: npm install --global wrangler@4.151.3

      - name: Deploy the static artifact and report the GitHub deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d6661214b1568252ad7874c9849b6c93
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.resolve-manual-pr.outputs.pr_number }}
          HEAD_SHA: ${{ needs.resolve-manual-pr.outputs.head_sha }}
        run: >-
          wrangler pages deploy app/dist
          --project-name=trailreplay-web
          --branch=cloudflare-preview/pr-${PR_NUMBER}
          --commit-hash=${HEAD_SHA}
          --commit-message=Manual-preview-PR-${PR_NUMBER}

  mirror:
    name: Mirror approved fork commit
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'alexalmansa'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: read
    steps:
      - name: Download request metadata
        uses: actions/download-artifact@v4
        with:
          name: approved-fork-preview-request
          path: fork-preview-request
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify approval and mirror the exact PR head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="$(cat fork-preview-request/pr-number)"
          requested_sha="$(cat fork-preview-request/head-sha)"
          case "$PR_NUMBER" in
            ''|*[!0-9]*)
              echo "The approved fork request contains an invalid pull request number."
              exit 1
              ;;
          esac
          [[ "$requested_sha" =~ ^[0-9a-f]{40}$ ]]

          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          state="$(jq -r '.state' <<<"$pr_json")"
          head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
          head_repo="$(jq -r '.head.repo.full_name' <<<"$pr_json")"

          test "$state" = open
          test "$head_repo" != "$GITHUB_REPOSITORY"
          test "$head_sha" = "$requested_sha"

          latest_review="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" \
              --jq '.[] | select(.user.login == "alexalmansa") | [.state, .commit_id] | @tsv' \
              | tail -n 1
          )"
          IFS=$'\t' read -r review_state review_sha <<<"$latest_review"

          test "$review_state" = APPROVED
          test "$review_sha" = "$head_sha"

          gh auth setup-git
          git init mirror
          git -C mirror remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C mirror fetch --no-tags --depth=1 origin "pull/${PR_NUMBER}/head"
          test "$(git -C mirror rev-parse FETCH_HEAD)" = "$head_sha"
          git -C mirror push --force origin \
            "$head_sha:refs/heads/cloudflare-preview/pr-${PR_NUMBER}"

  cleanup:
    name: Remove mirrored preview branch
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete the managed preview branch when present
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          ref="repos/${GITHUB_REPOSITORY}/git/ref/heads/cloudflare-preview/pr-${PR_NUMBER}"
          if ! gh api --method DELETE "$ref" >/dev/null 2>&1; then
            # The branch may already be gone, including in a concurrent cleanup.
            if gh api "$ref" >/dev/null 2>&1; then
              echo "Could not delete ${ref}."
              exit 1
            fi
          fi
