name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the v prefix (for example 1.0.1)'
        required: true
        type: string

permissions:
  contents: write
  checks: read

concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  release:
    name: Tag and publish GitHub Release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm --prefix app ci

      - name: Verify requested version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node -e 'const expected = require("./package.json").version; if (process.env.RELEASE_VERSION !== expected) { console.error(`Requested ${process.env.RELEASE_VERSION}, expected ${expected}`); process.exit(1) }'

      - name: Verify release metadata and production build
        run: |
          npm run verify:release -- --publish
          npm run build

      - name: Confirm tag does not already exist
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if git rev-parse "v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "v$RELEASE_VERSION already exists."
            exit 1
          fi

      - name: Confirm CI passed and Cloudflare deployed this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for check in check 'Cloudflare Pages'; do
            state="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" \
              --jq ".check_runs[] | select(.name == \"$check\") | .conclusion" | head -n 1)"
            test "$state" = "success" || {
              echo "$check has not succeeded for ${GITHUB_SHA}; refusing to publish."
              exit 1
            }
          done

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$RELEASE_VERSION" \
            --target "$GITHUB_SHA" \
            --title "TrailReplay v$RELEASE_VERSION" \
            --notes "$(node ./scripts/release-notes.mjs "$RELEASE_VERSION")" \
            --generate-notes
