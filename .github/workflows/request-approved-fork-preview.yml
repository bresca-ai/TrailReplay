name: Request approved fork preview

on:
  pull_request_review:
    types: [submitted]

# Fork-triggered workflows intentionally receive no write token or secrets.
permissions:
  contents: read
  pull-requests: read

jobs:
  request:
    name: Record approved fork preview request
    if: >-
      github.event.review.state == 'approved' &&
      github.event.review.user.login == 'alexalmansa' &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Record request
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "Cloudflare preview requested for PR #${PR_NUMBER} at ${HEAD_SHA}."

      - name: Save request metadata for the privileged workflow
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p fork-preview-request
          printf '%s\n' "$PR_NUMBER" > fork-preview-request/pr-number
          printf '%s\n' "$HEAD_SHA" > fork-preview-request/head-sha

      - name: Upload request metadata
        uses: actions/upload-artifact@v7
        with:
          name: approved-fork-preview-request
          path: fork-preview-request/
          if-no-files-found: error
          retention-days: 1
