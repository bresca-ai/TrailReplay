<svg xmlns="http://www.w3.org/2000/svg" viewBox="-120 220 1700 1480" role="img" aria-label="Loading">
<style>
svg{--ink:#1B2A20;--orange:#C1652F;--paper:#fff;--gold:#E9B44C}
.k{stroke:var(--ink);stroke-linecap:round}.w{stroke:var(--paper);stroke-linecap:round}
.o{stroke:var(--orange);stroke-linecap:round;fill:none;stroke-linejoin:round}.ko{stroke:var(--ink);stroke-linecap:round;fill:none;stroke-linejoin:round}
.skin{fill:var(--paper);stroke:var(--ink);stroke-width:46}.eye{fill:var(--ink)}
.ln{fill:none;stroke:var(--ink);stroke-width:18;stroke-linecap:round;stroke-linejoin:round}
.lid{fill:var(--paper)}
.gear{fill:var(--orange);stroke:var(--ink);stroke-width:38;stroke-linejoin:round}.gear.dark{fill:var(--ink)}
.pom{fill:var(--paper);stroke:var(--ink);stroke-width:34}.gog{fill:var(--orange);stroke:var(--ink);stroke-width:26;stroke-linejoin:round}
.shell{fill:var(--orange);stroke:var(--ink);stroke-width:46}.visor{fill:var(--paper);stroke:var(--ink);stroke-width:30;stroke-linejoin:round}.stripe{fill:none;stroke:var(--paper);stroke-width:26;stroke-linecap:round}
.body{fill:var(--orange);stroke:var(--ink);stroke-width:56;stroke-linejoin:round}.glass{fill:var(--paper);stroke:var(--ink);stroke-width:34;stroke-linejoin:round}
.inkfill{fill:var(--ink);stroke:var(--ink);stroke-width:30;stroke-linejoin:round}.paperfill{fill:var(--paper);stroke:var(--ink);stroke-width:30;stroke-linejoin:round}
.tyre{fill:var(--paper);stroke:var(--ink)}.spoke{stroke:var(--ink);stroke-width:14;opacity:.75}.valve{fill:var(--orange)}.hub{fill:var(--ink)}
.knob{fill:none;stroke:var(--ink);stroke-width:30;stroke-dasharray:34 30}
.puff{fill:var(--paper);stroke:var(--ink);stroke-width:16;opacity:0}
.bit{fill:var(--ink);opacity:0}.snow{fill:var(--paper);stroke:var(--ink);stroke-width:12;opacity:0}
.blink{opacity:0;animation:blink 4s infinite}@keyframes blink{0%,92%{opacity:0}93%,97%{opacity:1}98%,100%{opacity:0}}
@keyframes spin{to{rotate:360deg}}@keyframes unspin{to{rotate:-360deg}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.hide-still{opacity:0!important}}
.up{animation:bob 1.1s infinite linear}.lg1{animation:lt 1.1s infinite linear}.lg2{animation:ls 1.1s infinite linear}.lg3{animation:lf 1.1s infinite linear}
@keyframes bob{0.00%{translate:0 0.0px}6.25%{translate:0 16.1px}12.50%{translate:0 29.7px}18.75%{translate:0 38.8px}25.00%{translate:0 42.0px}31.25%{translate:0 38.8px}37.50%{translate:0 29.7px}43.75%{translate:0 16.1px}50.00%{translate:0 0.0px}56.25%{translate:0 -16.1px}62.50%{translate:0 -29.7px}68.75%{translate:0 -38.8px}75.00%{translate:0 -42.0px}81.25%{translate:0 -38.8px}87.50%{translate:0 -29.7px}93.75%{translate:0 -16.1px}100.00%{translate:0 -0.0px}}@keyframes lt{0.00%{rotate:-50.9deg}6.25%{rotate:-54.2deg}12.50%{rotate:-56.8deg}18.75%{rotate:-58.5deg}25.00%{rotate:-59.1deg}31.25%{rotate:-58.5deg}37.50%{rotate:-56.8deg}43.75%{rotate:-54.2deg}50.00%{rotate:-50.9deg}56.25%{rotate:-47.6deg}62.50%{rotate:-44.5deg}68.75%{rotate:-42.3deg}75.00%{rotate:-41.5deg}81.25%{rotate:-42.3deg}87.50%{rotate:-44.5deg}93.75%{rotate:-47.6deg}100.00%{rotate:-50.9deg}}@keyframes ls{0.00%{rotate:65.0deg}6.25%{rotate:70.2deg}12.50%{rotate:74.4deg}18.75%{rotate:77.1deg}25.00%{rotate:78.0deg}31.25%{rotate:77.1deg}37.50%{rotate:74.4deg}43.75%{rotate:70.2deg}50.00%{rotate:65.0deg}56.25%{rotate:59.4deg}62.50%{rotate:54.2deg}68.75%{rotate:50.4deg}75.00%{rotate:49.0deg}81.25%{rotate:50.4deg}87.50%{rotate:54.2deg}93.75%{rotate:59.4deg}100.00%{rotate:65.0deg}}@keyframes lf{0.00%{rotate:-14.1deg}6.25%{rotate:-16.1deg}12.50%{rotate:-17.6deg}18.75%{rotate:-18.6deg}25.00%{rotate:-18.9deg}31.25%{rotate:-18.6deg}37.50%{rotate:-17.6deg}43.75%{rotate:-16.1deg}50.00%{rotate:-14.1deg}56.25%{rotate:-11.8deg}62.50%{rotate:-9.7deg}68.75%{rotate:-8.1deg}75.00%{rotate:-7.5deg}81.25%{rotate:-8.1deg}87.50%{rotate:-9.7deg}93.75%{rotate:-11.8deg}100.00%{rotate:-14.1deg}}
.carve{animation:carve 2.2s infinite ease-in-out alternate}@keyframes carve{from{rotate:-3deg}to{rotate:2.5deg}}
.scarf{animation:scarf .28s infinite ease-in-out alternate}@keyframes scarf{from{rotate:-7deg;scale:1 1}to{rotate:9deg;scale:.93 1.1}}
.head{animation:nod 1.1s infinite ease-in-out}@keyframes nod{0%,100%{rotate:-3deg}50%{rotate:3deg}}
@keyframes snowfly{0%{opacity:0;translate:0 0;scale:.6}15%{opacity:1}100%{opacity:0;translate:-330px -170px;scale:1.3}}</style>
