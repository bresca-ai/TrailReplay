<svg xmlns="http://www.w3.org/2000/svg" viewBox="-140 220 2020 1560" role="img" aria-label="Loading">
<style>
svg{--ink:#1B2A20;--orange:#C1652F;--paper:#fff;--gold:#E9B44C}
.k{stroke:var(--ink);stroke-linecap:round}.w{stroke:var(--paper);stroke-linecap:round}
.o{stroke:var(--orange);stroke-linecap:round;fill:none;stroke-linejoin:round}.ko{stroke:var(--ink);stroke-linecap:round;fill:none;stroke-linejoin:round}
.skin{fill:var(--paper);stroke:var(--ink);stroke-width:46}.eye{fill:var(--ink)}
.ln{fill:none;stroke:var(--ink);stroke-width:18;stroke-linecap:round;stroke-linejoin:round}
.lid{fill:var(--paper)}
.gear{fill:var(--orange);stroke:var(--ink);stroke-width:38;stroke-linejoin:round}.gear.dark{fill:var(--ink)}
.pom{fill:var(--paper);stroke:var(--ink);stroke-width:34}.gog{fill:var(--orange);stroke:var(--ink);stroke-width:26;stroke-linejoin:round}
.shell{fill:var(--orange);stroke:var(--ink);stroke-width:46}.visor{fill:var(--paper);stroke:var(--ink);stroke-width:30;stroke-linejoin:round}.stripe{fill:none;stroke:var(--paper);stroke-width:26;stroke-linecap:round}
.body{fill:var(--orange);stroke:var(--ink);stroke-width:56;stroke-linejoin:round}.glass{fill:var(--paper);stroke:var(--ink);stroke-width:34;stroke-linejoin:round}
.inkfill{fill:var(--ink);stroke:var(--ink);stroke-width:30;stroke-linejoin:round}.paperfill{fill:var(--paper);stroke:var(--ink);stroke-width:30;stroke-linejoin:round}
.tyre{fill:var(--paper);stroke:var(--ink)}.spoke{stroke:var(--ink);stroke-width:14;opacity:.75}.valve{fill:var(--orange)}.hub{fill:var(--ink)}
.knob{fill:none;stroke:var(--ink);stroke-width:30;stroke-dasharray:34 30}
.puff{fill:var(--paper);stroke:var(--ink);stroke-width:16;opacity:0}
.bit{fill:var(--ink);opacity:0}.snow{fill:var(--paper);stroke:var(--ink);stroke-width:12;opacity:0}
.blink{opacity:0;animation:blink 4s infinite}@keyframes blink{0%,92%{opacity:0}93%,97%{opacity:1}98%,100%{opacity:0}}
@keyframes spin{to{rotate:360deg}}@keyframes unspin{to{rotate:-360deg}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.hide-still{opacity:0!important}}
.spin{animation:spin .45s infinite linear}
.vib{animation:vib .09s infinite linear alternate}@keyframes vib{from{translate:0 -3px}to{translate:0 4px}}
.wheelie{animation:wheelie 3.2s infinite ease-in-out}@keyframes wheelie{0%,52%{rotate:0deg}64%{rotate:-11deg}72%{rotate:-9deg}84%{rotate:1.5deg}92%,100%{rotate:0deg}}
.rider{animation:rider .5s infinite ease-in-out alternate}@keyframes rider{from{translate:0 -5px;rotate:-1deg}to{translate:0 9px;rotate:1.5deg}}
.head{animation:nod .5s infinite ease-in-out alternate}@keyframes nod{from{rotate:-3deg}to{rotate:3deg}}
.puff{animation:pufffly .9s infinite ease-out}@keyframes pufffly{0%{opacity:0;translate:0 0;scale:.4}18%{opacity:1}100%{opacity:0;translate:-330px -60px;scale:1.7}}
.flap{animation:flap .2s infinite ease-in-out alternate}@keyframes flap{from{rotate:-6deg}to{rotate:8deg}}</style>
<defs><filter id="ink" filterUnits="userSpaceOnUse" x="-440" y="-80" width="2620" height="2160"><feTurbulence type="fractalNoise" baseFrequency="0.008" numOctaves="2" seed="21"/><feDisplacementMap in="SourceGraphic" scale="22" xChannelSelector="R" yChannelSelector="G"/></filter></defs>
