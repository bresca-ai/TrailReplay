<svg xmlns="http://www.w3.org/2000/svg" viewBox="-140 150 1960 1700" role="img" aria-label="Loading">
<style>
svg{--ink:#1B2A20;--orange:#C1652F;--paper:#fff;--gold:#E9B44C}
.k{stroke:var(--ink);stroke-linecap:round}.w{stroke:var(--paper);stroke-linecap:round}
.o{stroke:var(--orange);stroke-linecap:round;fill:none;stroke-linejoin:round}.ko{stroke:var(--ink);stroke-linecap:round;fill:none;stroke-linejoin:round}
.skin{fill:var(--paper);stroke:var(--ink);stroke-width:46}.eye{fill:var(--ink)}
.ln{fill:none;stroke:var(--ink);stroke-width:18;stroke-linecap:round;stroke-linejoin:round}
.lid{fill:var(--paper)}
.gear{fill:var(--orange);stroke:var(--ink);stroke-width:38;stroke-linejoin:round}.gear.dark{fill:var(--ink)}
.pom{fill:var(--paper);stroke:var(--ink);stroke-width:34}.gog{fill:var(--orange);stroke:var(--ink);stroke-width:26;stroke-linejoin:round}
.shell{fill:var(--orange);stroke:var(--ink);stroke-width:46}.visor{fill:var(--paper);stroke:var(--ink);stroke-width:30;stroke-linejoin:round}.stripe{fill:none;stroke:var(--paper);stroke-width:26;stroke-linecap:round}
.body{fill:var(--orange);stroke:var(--ink);stroke-width:56;stroke-linejoin:round}.glass{fill:var(--paper);stroke:var(--ink);stroke-width:34;stroke-linejoin:round}
.inkfill{fill:var(--ink);stroke:var(--ink);stroke-width:30;stroke-linejoin:round}.paperfill{fill:var(--paper);stroke:var(--ink);stroke-width:30;stroke-linejoin:round}
.tyre{fill:var(--paper);stroke:var(--ink)}.spoke{stroke:var(--ink);stroke-width:14;opacity:.75}.valve{fill:var(--orange)}.hub{fill:var(--ink)}
.knob{fill:none;stroke:var(--ink);stroke-width:30;stroke-dasharray:34 30}
.puff{fill:var(--paper);stroke:var(--ink);stroke-width:16;opacity:0}
.bit{fill:var(--ink);opacity:0}.snow{fill:var(--paper);stroke:var(--ink);stroke-width:12;opacity:0}
.blink{opacity:0;animation:blink 4s infinite}@keyframes blink{0%,92%{opacity:0}93%,97%{opacity:1}98%,100%{opacity:0}}
@keyframes spin{to{rotate:360deg}}@keyframes unspin{to{rotate:-360deg}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.hide-still{opacity:0!important}}
.spin{animation:spin .9s infinite linear}.crank{animation:spin 0.8s infinite linear}
.leg1{animation:pt 0.8s infinite linear}.leg2{animation:ps 0.8s infinite linear}.leg3{animation:pf 0.8s infinite linear}
@keyframes pt{0.00%{rotate:-56.2deg}6.25%{rotate:-46.8deg}12.50%{rotate:-37.3deg}18.75%{rotate:-30.5deg}25.00%{rotate:-30.3deg}31.25%{rotate:-33.7deg}37.50%{rotate:-38.3deg}43.75%{rotate:-43.7deg}50.00%{rotate:-49.9deg}56.25%{rotate:-56.6deg}62.50%{rotate:-63.4deg}68.75%{rotate:-69.2deg}75.00%{rotate:-72.8deg}81.25%{rotate:-73.2deg}87.50%{rotate:-70.2deg}93.75%{rotate:-64.3deg}100.00%{rotate:-56.2deg}}@keyframes ps{0.00%{rotate:50.1deg}6.25%{rotate:36.3deg}12.50%{rotate:23.6deg}18.75%{rotate:16.9deg}25.00%{rotate:22.9deg}31.25%{rotate:35.5deg}37.50%{rotate:49.2deg}43.75%{rotate:62.5deg}50.00%{rotate:74.3deg}56.25%{rotate:83.9deg}62.50%{rotate:90.2deg}68.75%{rotate:92.6deg}75.00%{rotate:90.5deg}81.25%{rotate:84.4deg}87.50%{rotate:75.0deg}93.75%{rotate:63.3deg}100.00%{rotate:50.1deg}}@keyframes pf{0.00%{rotate:12.1deg}6.25%{rotate:11.9deg}12.50%{rotate:11.2deg}18.75%{rotate:8.6deg}25.00%{rotate:1.4deg}31.25%{rotate:-6.9deg}37.50%{rotate:-13.4deg}43.75%{rotate:-17.3deg}50.00%{rotate:-18.4deg}56.25%{rotate:-16.7deg}62.50%{rotate:-12.4deg}68.75%{rotate:-6.3deg}75.00%{rotate:0.3deg}81.25%{rotate:5.9deg}87.50%{rotate:9.7deg}93.75%{rotate:11.6deg}100.00%{rotate:12.1deg}}
.rock{animation:rock 1.1s infinite ease-in-out}@keyframes rock{0%,100%{rotate:0deg;translate:0 0}20%{rotate:-5deg;translate:0 -30px}45%{rotate:1deg;translate:0 6px}65%{rotate:4deg;translate:0 -22px}85%{rotate:-1deg;translate:0 4px}}
.upper{animation:absorb 1.1s infinite ease-in-out}@keyframes absorb{0%,100%{rotate:0deg}20%{rotate:4deg}45%{rotate:-2deg}65%{rotate:-4deg}85%{rotate:1deg}}
.head{animation:nod .55s infinite ease-in-out alternate}@keyframes nod{from{rotate:-4deg}to{rotate:3deg}}
.fork{stroke:var(--ink);stroke-width:74;stroke-linecap:round}.fork2{stroke:var(--paper);stroke-width:26;stroke-linecap:round}
.fk{fill:none;stroke:var(--ink);stroke-width:70;stroke-linecap:round;stroke-linejoin:round}.fo{fill:none;stroke:var(--orange);stroke-width:32;stroke-linecap:round;stroke-linejoin:round}
.ring{fill:var(--orange);stroke:var(--ink);stroke-width:22}
@keyframes bitfly{0%{opacity:0;translate:0 0}15%{opacity:1}100%{opacity:0;translate:-360px -240px}}</style>
