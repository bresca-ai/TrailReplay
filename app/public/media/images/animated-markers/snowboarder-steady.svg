ate:-53.1deg}100.00%{rotate:-57.2deg}}@keyframes bs{0.00%{rotate:56.4deg}6.25%{rotate:62.2deg}12.50%{rotate:66.7deg}18.75%{rotate:69.6deg}25.00%{rotate:70.5deg}31.25%{rotate:69.6deg}37.50%{rotate:66.7deg}43.75%{rotate:62.2deg}50.00%{rotate:56.4deg}56.25%{rotate:49.9deg}62.50%{rotate:43.6deg}68.75%{rotate:38.9deg}75.00%{rotate:37.1deg}81.25%{rotate:38.9deg}87.50%{rotate:43.6deg}93.75%{rotate:49.9deg}100.00%{rotate:56.4deg}}@keyframes bf{0.00%{rotate:0.9deg}6.25%{rotate:-1.1deg}12.50%{rotate:-2.5deg}18.75%{rotate:-3.4deg}25.00%{rotate:-3.6deg}31.25%{rotate:-3.4deg}37.50%{rotate:-2.5deg}43.75%{rotate:-1.1deg}50.00%{rotate:0.9deg}56.25%{rotate:3.2deg}62.50%{rotate:5.6deg}68.75%{rotate:7.5deg}75.00%{rotate:8.3deg}81.25%{rotate:7.5deg}87.50%{rotate:5.6deg}93.75%{rotate:3.2deg}100.00%{rotate:0.9deg}}
.carve{animation:carve 2.4s infinite ease-in-out alternate}@keyframes carve{from{rotate:-7deg}to{rotate:6deg}}
.lean{animation:lean 2.4s infinite ease-in-out alternate}@keyframes lean{from{rotate:6deg}to{rotate:-5deg}}
.ba1{animation:ba1 1.2s infinite ease-in-out alternate}.ba2{animation:ba2 0.6s infinite ease-in-out alternate}
.fa1{animation:fa1 1.2s infinite ease-in-out alternate}.fa2{animation:fa2 0.6s infinite ease-in-out alternate}
@keyframes ba1{from{rotate:62deg}to{rotate:98deg}}@keyframes ba2{from{rotate:6deg}to{rotate:34deg}}
@keyframes fa1{from{rotate:-104deg}to{rotate:-66deg}}@keyframes fa2{from{rotate:-34deg}to{rotate:-6deg}}
.head{animation:nod 1.2s infinite ease-in-out}@keyframes nod{0%,100%{rotate:-4deg}50%{rotate:4deg}}
@keyframes snowfly{0%{opacity:0;translate:0 0;scale:.6}15%{opacity:1}100%{opacity:0;translate:-300px -200px;scale:1.3}}</style>
