" y1="158" x2="384" y2="256" stroke-width="60"/><g class="vf2" style="transform-origin:384px 256px;animation-delay:0s"><line class="k" x1="384" y1="256" x2="384" y2="360" stroke-width="60"/><line class="w" x1="384" y1="256" x2="384" y2="360" stroke-width="27"/></g><line class="w" x1="384" y1="158" x2="384" y2="256" stroke-width="27"/></g></g></g>
