<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -150 690 492" role="img" aria-label="Done">
<style>svg{--ink:#1B2A20;--orange:#C1652F;--paper:#fff}
.k{stroke:var(--ink);stroke-linecap:round}.w{stroke:var(--paper);stroke-linecap:round}
.headart path:not([fill]):not(.cap){fill:var(--ink)}.cap{fill:var(--orange)}
.sea path:not([fill]){fill:var(--ink)}
.ln{fill:none;stroke:var(--ink);stroke-width:6.5;stroke-linecap:round;stroke-linejoin:round}
.lid{fill:var(--paper)}.maw{fill:var(--ink)}
.arm1{animation:spin 1.3s infinite linear}.arm2{animation:elbow 1.3s infinite linear}
@keyframes spin{from{rotate:0deg}to{rotate:360deg}}
@keyframes elbow{0%{rotate:-22deg}25%{rotate:42deg}38%{rotate:72deg}50%{rotate:58deg}75%{rotate:4deg}100%{rotate:-22deg}}
.bob{animation:bob 0.65s infinite ease-in-out alternate}@keyframes bob{from{translate:0 3px;rotate:-2deg}to{translate:0 -5px;rotate:2.5deg}}
.head{animation:nod 0.65s infinite ease-in-out alternate}@keyframes nod{from{rotate:-4deg}to{rotate:5deg}}
.kick{animation:kick .26s infinite ease-in-out alternate}.kick.b{animation-delay:-.26s}
@keyframes kick{from{translate:0 0}to{translate:0 34px}}
.spl{fill:var(--paper);stroke:var(--ink);stroke-width:4;opacity:0;animation:spl .52s infinite ease-out}.spl.b{animation-delay:-.17s}.spl.c{animation-delay:-.34s}
@keyframes spl{0%{opacity:0;translate:0 14px}20%{opacity:1}100%{opacity:0;translate:-22px -46px}}
.sea{animation:sea 1.6s infinite ease-in-out alternate}@keyframes sea{from{translate:-9px 0}to{translate:9px 2px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.hide-still{opacity:0!important}}
.runarm{animation:runarm 5s infinite}.vic{opacity:0;animation:vic 5s infinite}
@keyframes runarm{0%,40%{opacity:1}41%,88%{opacity:0}89%,100%{opacity:1}}
@keyframes vic{0%,40%{opacity:0}41%,88%{opacity:1}89%,100%{opacity:0}}
.vf1{animation:vf1 .4s infinite alternate ease-in-out}.vf2{animation:vf2 .4s infinite alternate ease-in-out}
.vb1{animation:vb1 .4s infinite alternate ease-in-out}.vb2{animation:vb2 .4s infinite alternate ease-in-out}
@keyframes vf1{from{rotate:-64deg}to{rotate:-78deg}}@keyframes vf2{from{rotate:-18deg}to{rotate:-44deg}}
@keyframes vb1{from{rotate:142deg}to{rotate:158deg}}@keyframes vb2{from{rotate:14deg}to{rotate:38deg}}
.story{animation:rise 5s infinite}
@keyframes rise{0%,39%{translate:0 0;rotate:0deg}45%{translate:-10px -62px;rotate:-22deg}52%{translate:-10px -40px;rotate:-20deg}60%{translate:-10px -58px;rotate:-22deg}68%{translate:-10px -40px;rotate:-20deg}76%{translate:-10px -54px;rotate:-21deg}84%{translate:-10px -40px;rotate:-20deg}92%,100%{translate:0 0;rotate:0deg}}
.ring{fill:none;stroke:var(--ink);stroke-width:6;stroke-linecap:round;opacity:0;animation:ring 5s infinite ease-out}
@keyframes ring{0%,40%{opacity:0;scale:.5}43%{opacity:1;scale:1}54%,100%{opacity:0;scale:1.35}}
.conf{opacity:0;transform-box:fill-box;transform-origin:center;animation:conf 5s infinite cubic-bezier(.15,.7,.4,1)}
@keyframes conf{0%,41%{opacity:0;translate:0 0;rotate:0deg}42%{opacity:1;translate:0 0}70%{opacity:1}82%,100%{opacity:0;translate:var(--x) calc(var(--y) + 150px);rotate:var(--r)}}
.fresh{animation:runarm 5s infinite}</style>
