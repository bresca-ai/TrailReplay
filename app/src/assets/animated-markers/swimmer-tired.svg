<filter id="ink" filterUnits="userSpaceOnUse" x="-100" y="-300" width="800" height="700"><feTurbulence type="fractalNoise" baseFrequency=".028" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="6" xChannelSelector="R" yChannelSelector="G"/></filter></defs>
